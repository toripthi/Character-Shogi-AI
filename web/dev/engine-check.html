<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>エンジン接続の自己点検</title>
  <style>
    body { font: 15px/1.5 system-ui, -apple-system, "Hiragino Sans", sans-serif; margin: 1rem; background: #f8f4e9; color: #231f18; }
    h1 { font-size: 1.1rem; }
    li { margin: .3rem 0; list-style: none; padding-left: 1.6rem; position: relative; }

  </style>
</head>

  <p><small>repo のルートを <code>npm run web</code> で配信して開く。指す機能の画面ではなく、B 段階の部品を実ブラウザで確かめるページ。</small></p>
  <ul id="list"></ul>
  <div id="summary">実行中…</div>
